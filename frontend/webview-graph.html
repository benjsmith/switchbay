<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graph</title>
  <style>
    html, body { height: 100%; width: 100%; margin: 0; overflow: hidden; }
    /* VS Code injects body padding; it clips the right-hand chrome. */
    body { padding: 0 !important; background: var(--bg, #0f1115); color: var(--text, #e6e8eb); }
    #mount { position: absolute; inset: 0; display: flex; flex-direction: column; min-width: 0; }
    #mount > #graph-pane { flex: 1; min-height: 0; min-width: 0; position: relative; display: flex; flex-direction: column; }
    #mount #graph { flex: 1; min-height: 120px; min-width: 0; }
    .sy-status {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: 2rem; text-align: center; font: 13px/1.5 var(--vscode-font-family, sans-serif);
      color: var(--vscode-descriptionForeground, #9aa0a6); z-index: 60;
    }
    .sy-status[hidden] { display: none; }
    .sy-vscode-page-actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
    .sy-vscode-page-actions .ctrl-btn { position: static; }
    .ctx-menu {
      position: fixed; z-index: 2000; min-width: 12rem;
      background: var(--vscode-menu-background, #1c1c1c);
      color: var(--vscode-menu-foreground, #ccc);
      border: 1px solid var(--vscode-widget-border, #444);
    }
    .ctx-menu button {
      display: block; width: 100%; text-align: left; background: none; border: 0;
      color: inherit; padding: 0.35rem 0.8rem; cursor: pointer; font: inherit;
    }
    .ctx-menu button:hover { background: var(--vscode-menu-selectionBackground, #37373d); }
  </style>
</head>
<body>
  <div id="mount"></div>
  <div id="status" class="sy-status" hidden></div>
  <div id="ctx" class="ctx-menu" hidden></div>
  <script type="module" src="./src/webview-graph.ts"></script>
</body>
</html>
