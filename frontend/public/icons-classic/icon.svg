<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App icon: the favicon's five slanted switches on a dark rounded
       tile, centered within the maskable safe zone (~80%). Shares the
       graph type-palette colours with the favicon + workbench. -->
  <rect width="512" height="512" rx="112" fill="#0f1115"/>
  <g transform="translate(96 96) scale(10)">
    <g stroke-linecap="round" stroke-width="3.2" fill="none">
      <line x1="5"  y1="27" x2="11" y2="7" stroke="#a76aaa"/>
      <line x1="9"  y1="27" x2="15" y2="7" stroke="#59a14f"/>
      <line x1="13" y1="27" x2="19" y2="7" stroke="#f28e2b"/>
      <line x1="17" y1="27" x2="23" y2="7" stroke="#e377c2"/>
      <line x1="21" y1="27" x2="27" y2="7" stroke="#4a7ab8"/>
    </g>
    <circle cx="4"  cy="28" r="2.2" fill="#cdd2da"/>
    <circle cx="28" cy="4"  r="2.2" fill="#cdd2da"/>
  </g>
</svg>
