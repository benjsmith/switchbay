name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  no-plugin-experiment:
    name: VS Code plugin experiment must not be on this branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if experiment files are in the tree
        run: |
          if [ -e switchbay.code-workspace ] || [ -d extensions/switchbay ] || [ -d extensions/switchbay-sketch ]; then
            echo "VS Code plugin files belong on exp/vscode-plugin, not main."
            ls -la switchbay.code-workspace extensions 2>/dev/null || true
            exit 1
          fi

  python:
    name: Python unit tests + import smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.13
      - name: Sync (dev group)
        run: uv sync --locked --group dev
      - name: Unit tests
        run: uv run --no-sync pytest
      - name: Import smoke (daemon must import cleanly)
        env:
          PYTHONPATH: src
        run: uv run --no-sync python -c "import switchbay.daemon"

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@22
          cache: true
          install: false
      - name: Install
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Typecheck + build
        run: pnpm --dir frontend run build
